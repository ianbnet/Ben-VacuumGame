<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomba Vacuum Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <h1 id="gameTitle">Roomba Vacuum</h1>
        <canvas id="gameCanvas" width="720" height="576" role="img" aria-label="Game board"></canvas>
        <div id="controlPanel">
            <div id="statsPanel">
                <div class="stat">
                    <span class="stat-label">Cleaned</span>
                    <span id="cleanedCount" class="stat-value">0 / 0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Moves <span id="parLabel" class="par-label">(par: <span id="parCount">--</span>)</span></span>
                    <span id="moveCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span id="scoreDisplay" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Dock</span>
                    <span id="dockDist" class="stat-value">--</span>
                </div>
            </div>
            <div id="dpadContainer">
                <div id="dpad" role="group" aria-label="Movement controls">
                    <button class="dpad-btn" id="btnUp" data-dir="up" aria-label="Up">&#9650;</button>
                    <button class="dpad-btn" id="btnLeft" data-dir="left" aria-label="Left">&#9664;</button>
                    <button class="dpad-btn dpad-center" id="btnCenter" disabled aria-hidden="true"></button>
                    <button class="dpad-btn" id="btnRight" data-dir="right" aria-label="Right">&#9654;</button>
                    <button class="dpad-btn" id="btnDown" data-dir="down" aria-label="Down">&#9660;</button>
                </div>
            </div>
            <div id="rightPanel">
                <div id="batteryContainer">
                    <span class="stat-label">Battery</span>
                    <div id="batteryBar">
                        <div id="batteryFill"></div>
                    </div>
                    <span id="batteryText">100%</span>
                </div>
                <div id="levelDisplay">
                    <span class="stat-label">Level</span>
                    <span id="levelNum" class="stat-value">1</span>
                </div>
                <button id="btnViewToggle" class="action-btn">3D View</button>
                <button id="btnRestart" class="action-btn">Restart</button>
                <button id="btnHelp" class="action-btn action-btn-quiet">Help</button>
                <button id="btnMute" class="action-btn action-btn-quiet" aria-pressed="false">Sound on</button>
                <button id="btnDesign" class="action-btn action-btn-quiet" aria-expanded="false" aria-controls="designPanel">Design</button>
            </div>
        </div>
        <div id="designPanel" class="design-panel" hidden>
            <div class="design-head">
                <span class="stat-label">Vacuum design</span>
                <div>
                    <button id="btnDesignReset" class="action-btn action-btn-quiet">Reset</button>
                    <button id="btnDesignClose" class="action-btn action-btn-quiet">Close</button>
                </div>
            </div>
            <div class="design-row">
                <div class="design-field" id="lightsField">
                    <span class="field-label">Vacuum lights</span>
                    <canvas id="wheelLights" class="color-wheel" width="110" height="110" tabindex="0" role="slider" aria-label="Vacuum light colour"></canvas>
                    <span class="swatch-row"><span id="swatchLights" class="swatch"></span><span id="hexLights">#1A9A8A</span></span>
                </div>
                <div class="design-field" id="flashField">
                    <label class="switch field-label"><input type="checkbox" id="flashToggle"><span class="track" aria-hidden="true"></span><span>Flashlight</span></label>
                    <canvas id="wheelFlash" class="color-wheel" width="110" height="110" tabindex="0" role="slider" aria-label="Flashlight colour"></canvas>
                    <span class="swatch-row"><span id="swatchFlash" class="swatch"></span><span id="hexFlash">#FFE2A8</span></span>
                </div>
            </div>
        </div>
        <div id="legend">Arrows / WASD move (hold to keep going) &middot; V 3D view &middot; F flashlight &middot; R restart &middot; Space next level &middot; W ghost &middot; M sound &middot; H help</div>
        <div id="levelSelect" role="group" aria-label="Level select"></div>
        <div id="srStatus" class="visually-hidden" aria-live="polite"></div>
    </div>
    <script src="core.js"></script>
    <script src="design.js"></script>
    <script src="render2d.js"></script>
    <script src="render3d.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
